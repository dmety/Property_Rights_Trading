import java.util.Properties

plugins {
    alias(libs.plugins.android.application)
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { stream -> localProperties.load(stream) }
}
def buildConfigValue = { key, fallback ->
    def value = localProperties.getProperty(key, fallback)
    return "\"${value.replace("\\", "\\\\").replace("\"", "\\\"")}\""
}

android {
    namespace 'com.example.testforenv'
    compileSdk 34
    buildFeatures {
        buildConfig true
    }
    packagingOptions {
        // 忽略所有 META-INF/io.netty.versions.properties 文件
        exclude 'META-INF/io.netty.versions.properties'
        exclude 'META-INF/INDEX.LIST'


        // 如果你有其他需要忽略的文件，可以在这里添加
        // exclude 'META-INF/some_other_file.properties'
    }
    defaultConfig {
        applicationId "com.example.testforenv"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        buildConfigField "String", "API_BASE_URL", buildConfigValue("API_BASE_URL", "http://10.0.2.2:8080")
        buildConfigField "String", "LOCAL_AI_BACKEND_URL", buildConfigValue("LOCAL_AI_BASE_URL", "http://10.0.2.2:11434/v1/chat/completions")
        buildConfigField "String", "PYTHON_AI_BACKEND_URL", buildConfigValue("PYTHON_AI_BASE_URL", "http://10.0.2.2:8000")
        buildConfigField "String", "CHAT_ANYWHERE_TOKEN", buildConfigValue("CHAT_ANYWHERE_TOKEN", "")
        buildConfigField "String", "CHAT_ANYWHERE_URL", buildConfigValue("CHAT_ANYWHERE_URL", "")
        buildConfigField "String", "XUNFEI_APP_ID", buildConfigValue("XUNFEI_APP_ID", "")

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }


    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}


server:
  port: ${SERVER_PORT:8080}
spring:
  datasource:
    url: "${DB_URL:jdbc:mysql://127.0.0.1:3306/blockexplore?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}"
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true
  mapper-locations: classpath*:/mapper/**/*.xml
  typeAliasesPackage: com.blockexplore.model,cn.edu.cjxy.iotlink.model
  global-config:
    refresh-mapper: true
    db-column-underline: true
mqtt:
  hostUrl: ${MQTT_HOST_URL:tcp://127.0.0.1:1883}
  userName: ${MQTT_USERNAME:}
  passWord: ${MQTT_PASSWORD:}
  clientId: iotlink-client
  devicePubTopic: /iotlink/up
  deviceSubTopic: /iotlink/down
